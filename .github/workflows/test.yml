name: Test

# Every code change is tested before it can go live: on a pull request and on a push to main, the Python checks and the
# browser checks run side by side.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Python lint (Ruff)
        run: ruff check .

      - name: Python self-tests (every tests/test_*.py)
        run: python tests/run_all.py

  # Node tooling (package.json): lint and type checks on the page's script, then the Playwright tests on the committed site
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (TypeScript in JavaScript mode)
        run: npm run typecheck

      - name: Chrome for the browser tests
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then echo "::error::no Chrome on the runner"; exit 1; fi
          "$CHROME" --version
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"

      - name: Browser tests (Playwright) on the committed site
        run: npm run test:e2e

      - name: Screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
