name: Deploy site

# Publishes one commit of main to GitHub Pages, then checks the public site serves it. Called only after that commit has
# passed its checks: by test.yml for code changes and by update.yml for data updates. Needs Settings, Pages, Source set
# to "GitHub Actions". A commit that is no longer the tip of main is not published: when a code push and a data update
# land together, the later deploy must not put back a site without the newer commit (31 Oct: the merge's test run
# deployed after the update run and took the night's games off the site).

on:
  workflow_call:
    inputs:
      ref:
        description: The tested commit to publish
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read             # the private league file from fantasy.yml's last run

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Still the newest commit of main (else the newer commit's own run deploys it)
        id: newest
        run: |
          TIP=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$TIP" = "$(git rev-parse HEAD)" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::main is at $TIP now, newer than $(git rev-parse HEAD): not deployed"; fi

      - name: Stage the site (the repository without dotfiles, version.txt naming the commit, index.html rebuilt)
        if: steps.newest.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.*' --exclude='cache/' --exclude='node_modules/' ./ "$RUNNER_TEMP/site/"
          git rev-parse HEAD > "$RUNNER_TEMP/site/version.txt"
          python3 build.py --out="$RUNNER_TEMP/site"   # the page from this commit's template.html, not a stale index.html
          du -sh "$RUNNER_TEMP/site"

      # the private league file (fantasy.yml): this run's, else the newest successful run's while under 23 hours old
      - name: League file from this run
        if: steps.newest.outputs.ok == 'true'
        id: league
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: league
          path: ${{ runner.temp }}/site

      - name: League file from the last league run
        if: steps.newest.outputs.ok == 'true' && steps.league.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fantasy.yml --status success --limit 1 \
            --json databaseId,createdAt --jq '.[] | select(now - (.createdAt | fromdate) < 23*3600) | .databaseId' 2>/dev/null || true)
          if [ -n "$RUN" ]; then gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name league --dir "$RUNNER_TEMP/site" || true; fi
          echo "league files: $(find "$RUNNER_TEMP/site/fantasy" -name '*.enc' 2>/dev/null | wc -l)"

      - uses: actions/configure-pages@v6
        if: steps.newest.outputs.ok == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.newest.outputs.ok == 'true'
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        if: steps.newest.outputs.ok == 'true'
        uses: actions/deploy-pages@v5

      - name: Live check (the public site serves this commit)
        if: steps.newest.outputs.ok == 'true'
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: SHA=$(git rev-parse HEAD) python live.py
