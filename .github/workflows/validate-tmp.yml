name: Temporary feed validation
on:
  push:
    branches: [tmp-validate]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v5
        with:
          path: cache/
          key: feeds-tmp-${{ github.run_id }}
          restore-keys: feeds-tmp-
      - run: python fetch_season.py 2025-26 | tail -5
      - run: python fetch_season.py 2026-27 | tail -5
      - name: Warehouse and checks
        run: |
          python warehouse.py 2025-26 && python warehouse.py 2026-27
          mkdir -p sample
          python warehouse_tests.py 2025-26 > sample/report_2025-26.txt 2>&1 || true
          python warehouse_tests.py 2026-27 > sample/report_2026-27.txt 2>&1 || true
          cat sample/report_2025-26.txt
      - name: Commit sample files back
        if: always()
        run: |
          mkdir -p sample
          for g in 0022500001 0022500002 0022500100; do cp cache/2025-26/box_$g.json cache/2025-26/pbp_$g.json sample/ || true; done
          cp cache/2026-27/schedule.json sample/schedule_2026-27.json || true
          rm -f .github/workflows/validate-tmp.yml
          cp -r warehouse sample/warehouse || true
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A sample .github && git commit -m "validation sample" && git push
